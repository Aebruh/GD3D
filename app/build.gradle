plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gd3d.editor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gd3d.editor'
        minSdk 26
        targetSdk 35
        versionCode 82
        versionName '0.80.2-alpha'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
